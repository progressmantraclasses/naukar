                        - text: ).
                      - paragraph
                      - paragraph [ref=f4e94]:
                        - generic [ref=f4e95]: Copyright of NCERT Textbooks and terms of use
                      - paragraph
                      - paragraph [ref=f4e96]: Please note that the NCERT textbooks are copyrighted.
                      - paragraph
                      - paragraph [ref=f4e97]: While copies of these textbooks may be downloaded and used as textbooks or for reference, republication of NCERT textbooks by any other individual or agency is strictly prohibited. No agency or individual may make electronic or print copies of these books and redistribute them in any form whatsoever. Use of these online books as a part of digital content packages or software is also strictly prohibited. No website or online service is permitted to host these online textbooks.
                      - paragraph
                      - paragraph [ref=f4e98]: Links may however be provided with written permission from the NCERT.
                      - paragraph
                      - paragraph [ref=f4e99]: Discouraging Piracy
                      - paragraph
                      - paragraph [ref=f4e100]: In order to discourage piracy, the online textbooks carry a watermark on all pages declaring the copyright of NCERT. DO NOT BUY OR SELL electronic or printed books with watermarked pages.
                      - paragraph
                      - paragraph [ref=f4e101]: Please bring to our notice any infringement or violation of copyright and commercial exploitation of these textbooks.
                      - paragraph
                      - paragraph [ref=f4e102]: Join us in the Education for All mission . Help us reach these textbooks to children, teachers and schools.
                      - paragraph
                      - paragraph [ref=f4e103]: Help us improve our services. Send your comments, suggestions or queries to dceta.ncert@nic.in
