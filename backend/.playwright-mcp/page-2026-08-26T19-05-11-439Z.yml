                      - paragraph [ref=f4e87]: Welcome to the Online Textbooks Section
                      - paragraph [ref=f4e88]: This online service offers easy access to the NCERT textbooks. The service covers textbooks of all subjects published by NCERT for classes I to XII in Hindi, English and Urdu. The Entire book or individual chapters can be downloaded provided the terms of use as mentioned in the Copyright Notice is adhered to.
                      - paragraph
                      - paragraph [ref=f4e89]:
                        - text: Catalogue of Textbooks (Grades I–VIII) and Indian Language Primers (
                        - link "Pdf" [ref=f4e90] [cursor=pointer]:
                          - /url: pdf/Textbooks_Primer_Brochure/Textbooks_Primer_Brochure.pdf
                        - text: "||"
